<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>За теб ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #14081e 0%, #06030c 70%, #020105 100%);
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      user-select: none;
    }

    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Стартов екран "Натисни ме" */
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 2, 10, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #start-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #start-btn {
      background: linear-gradient(135deg, #ff4d94 0%, #c91865 100%);
      border: 1px solid rgba(255, 190, 220, 0.6);
      color: #fff;
      padding: 18px 42px;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 77, 148, 0.65);
      animation: pulseBtn 2s infinite;
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 77, 148, 0.6); }
      50% { transform: scale(1.05); box-shadow: 0 0 42px rgba(255, 77, 148, 0.95); }
    }

    /* Основен контейнер */
    .main-content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    /* Сърце / Снимка */
    .heart-wrapper {
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-bottom: 22px;
      position: relative;
    }

    .heart-icon {
      width: 130px;
      height: 130px;
      fill: #ff3385;
      filter: drop-shadow(0 0 25px rgba(255, 51, 133, 0.85));
      animation: heartbeat 1.5s infinite ease-in-out;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.14); }
      28% { transform: scale(1); }
      42% { transform: scale(1.1); }
      70% { transform: scale(1); }
    }

    .couple-photo {
      width: 185px;
      height: 185px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255, 140, 190, 0.85);
      box-shadow: 0 0 35px rgba(255, 77, 148, 0.75);
      display: none;
      animation: fadeInPhoto 0.5s ease;
    }

    @keyframes fadeInPhoto {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .hint-text {
      font-size: 12px;
      color: rgba(255, 200, 225, 0.6);
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    .love-quote {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      color: #ffe6f0;
      text-shadow: 0 0 18px rgba(255, 105, 180, 0.65);
      max-width: 650px;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    /* Таймер (стъклени карти с неоново-розово сияние) */
    #love-timer {
      margin-top: 22px;
      text-align: center;
      z-index: 10;
      position: relative;
      font-family: 'Montserrat', sans-serif;
    }

    .timer-title {
      font-size: 14px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 220, 235, 0.85);
      margin-bottom: 12px;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.6);
    }

    .timer-boxes {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .t-box {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 140, 190, 0.38);
      backdrop-filter: blur(6px);
      border-radius: 12px;
      padding: 10px 14px;
      min-width: 68px;
      box-shadow: 0 0 18px rgba(255, 70, 140, 0.2);
    }

    .t-box span {
      display: block;
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 120, 180, 0.85);
      line-height: 1.1;
    }

    .t-box small {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 200, 225, 0.78);
      margin-top: 4px;
    }

    /* Бутон за музика */
    #music-toggle {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 140, 190, 0.35);
      backdrop-filter: blur(6px);
      color: #ffd6e7;
      padding: 9px 15px;
      border-radius: 25px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Стартов екран -->
  <div id="start-overlay">
    <button id="start-btn" type="button">Натисни ме ❤️</button>
  </div>

  <!-- Звездно небе -->
  <canvas id="starfield"></canvas>

  <!-- Основно съдържание -->
  <main class="main-content">
    <div class="heart-wrapper" id="heart-toggle" title="Натисни сърцето">
      <svg class="heart-icon" id="heart-svg" viewBox="0 0 32 29.6">
        <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
        c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
      </svg>
      <img src="photo.jpg" alt="Ние" class="couple-photo" id="couple-img">
    </div>

    <div class="hint-text">(натисни сърцето)</div>

    <div class="love-quote">
      Всяка звезда на небето ми напомня за теб... ✨
    </div>

    <!-- Таймер от 19.09.2026 11:59 -->
    <div id="love-timer">
      <div class="timer-title">Заедно сме вече:</div>
      <div class="timer-boxes">
        <div class="t-box"><span id="t-days">0</span><small>дни</small></div>
        <div class="t-box"><span id="t-hours">00</span><small>часа</small></div>
        <div class="t-box"><span id="t-mins">00</span><small>минути</small></div>
        <div class="t-box"><span id="t-secs">00</span><small>секунди</small></div>
      </div>
    </div>
  </main>

  <audio id="bg-audio" src="music.mp3" loop preload="auto"></audio>
  <button id="music-toggle" type="button">🔊 Музика</button>

  <script>
    // 1. Звездно небе
    (function() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;
      const stars = [];
      const count = Math.min(240, Math.floor((w * h) / 6500));

      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.6 + 0.4,
          alpha: Math.random(),
          dAlpha: (Math.random() * 0.02 + 0.005) * (Math.random() < 0.5 ? 1 : -1),
          vy: Math.random() * 0.25 + 0.05
        });
      }

      window.addEventListener('resize', function() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      function draw() {
        ctx.clearRect(0, 0, w, h);
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.y -= s.vy;
          if (s.y < 0) s.y = h;
          s.alpha += s.dAlpha;
          if (s.alpha > 1 || s.alpha < 0.15) s.dAlpha = -s.dAlpha;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 240, 250, ' + s.alpha.toFixed(2) + ')';
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      draw();
    })();

    // 2. Старт и музика
    (function() {
      const overlay = document.getElementById('start-overlay');
      const startBtn = document.getElementById('start-btn');
      const audio = document.getElementById('bg-audio');
      const musicBtn = document.getElementById('music-toggle');
      let playing = false;

      startBtn.addEventListener('click', function() {
        overlay.classList.add('hidden');
        audio.play().then(function() {
          playing = true;
          musicBtn.textContent = '🔊 Музика';
        }).catch(function() {
          musicBtn.textContent = '🔇 Музика';
        });
      });

      musicBtn.addEventListener('click', function() {
        if (playing) {
          audio.pause();
          playing = false;
          musicBtn.textContent = '🔇 Музика';
        } else {
          audio.play().then(function() {
            playing = true;
            musicBtn.textContent = '🔊 Музика';
          }).catch(function() {});
        }
      });
    })();

    // 3. Превключване между сърце и снимка
    (function() {
      const wrapper = document.getElementById('heart-toggle');
      const heart = document.getElementById('heart-svg');
      const img = document.getElementById('couple-img');
      let showPhoto = false;

      wrapper.addEventListener('click', function() {
        showPhoto = !showPhoto;
        if (showPhoto) {
          heart.style.display = 'none';
          img.style.display = 'block';
        } else {
          img.style.display = 'none';
          heart.style.display = 'block';
        }
      });
    })();

    // 4. Таймер от 19.09.2026 11:59:00
    (function() {
      const startDate = new Date(2026, 8, 19, 11, 59, 0);

      function updateLoveTimer() {
        const now = new Date();
        let diff = Math.floor((now - startDate) / 1000);
        if (diff < 0) diff = 0;

        const days = Math.floor(diff / 86400);
        const hours = Math.floor((diff % 86400) / 3600);
        const mins = Math.floor((diff % 3600) / 60);
        const secs = diff % 60;

        document.getElementById('t-days').textContent = days;
        document.getElementById('t-hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('t-mins').textContent = String(mins).padStart(2, '0');
        document.getElementById('t-secs').textContent = String(secs).padStart(2, '0');
      }

      updateLoveTimer();
      setInterval(updateLoveTimer, 1000);
    })();
  </script>
</body>
</html>
