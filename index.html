<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Обичам те, МИМИ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #030108;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none; -webkit-user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #intro-screen {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, #1a0514 0%, #030108 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; pointer-events: auto;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #intro-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .intro-sub {
      color: rgba(255, 200, 225, 0.75); font-size: 14px; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 24px;
      animation: fadeFloat 2.5s infinite ease-in-out;
    }
    #start-btn {
      position: relative; z-index: 10000; pointer-events: auto;
      padding: 18px 42px; font-size: 20px; font-weight: 700; color: #ffffff;
      background: linear-gradient(135deg, #ff1e6e 0%, #ff5e9c 100%);
      border: 1px solid rgba(255, 180, 210, 0.6); border-radius: 50px;
      cursor: pointer; letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(255, 30, 110, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.3);
      animation: pulseStart 1.8s infinite ease-in-out;
      transition: transform 0.2s ease; -webkit-tap-highlight-color: transparent;
    }
    #start-btn:active { transform: scale(0.94); }
    @keyframes pulseStart {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 30, 110, 0.6); }
      50% { transform: scale(1.07); box-shadow: 0 0 45px rgba(255, 45, 125, 0.95); }
    }
    @keyframes fadeFloat {
      0%, 100% { opacity: 0.6; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }
    #ui {
      position: fixed; top: 20px; left: 0; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      pointer-events: none; z-index: 10; opacity: 0; transition: opacity 1.2s ease;
    }
    .hint {
      color: rgba(255, 210, 230, 0.9); font-size: 12px; letter-spacing: 0.4px;
      background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(8px);
      padding: 7px 16px; border-radius: 20px; border: 1px solid rgba(255, 105, 180, 0.3);
      transition: opacity 0.6s ease;
    }
    #music-btn {
      position: fixed; top: 20px; right: 16px; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255, 40, 110, 0.25); border: 1px solid rgba(255, 105, 180, 0.6);
      color: #fff; font-size: 18px; display: none; align-items: center; justify-content: center;
      cursor: pointer; z-index: 20; backdrop-filter: blur(6px);
      box-shadow: 0 0 15px rgba(255, 40, 110, 0.4);
    }
    #music-btn.playing { animation: pulseBtn 1.5s infinite; }
    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 40, 110, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 22px rgba(255, 40, 110, 0.8); }
    }
    #love-timer {
      position: fixed; bottom: 22px; left: 0; width: 100%; text-align: center;
      z-index: 15; pointer-events: none; opacity: 0; transition: opacity 1.2s ease; padding: 0 12px;
    }
    .timer-title {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255, 210, 230, 0.85); margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(255, 30, 110, 0.8);
    }
    .timer-boxes { display: flex; justify-content: center; gap: 8px; }
    .t-box {
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 105, 180, 0.38);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 12px; padding: 8px 11px; min-width: 62px;
      box-shadow: 0 0 18px rgba(255, 30, 110, 0.25);
    }
    .t-box span {
      display: block; font-size: 20px; font-weight: 700; color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 60, 140, 0.9); line-height: 1.1;
    }
    .t-box small {
      display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.8px;
      color: rgba(255, 200, 225, 0.8); margin-top: 3px;
    }
    #fx-canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 12; }
  </style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-sub">Имам изненада за теб</div>
    <button id="start-btn" type="button" onclick="startExperience()">Натисни ме ❤️</button>
  </div>

  <button id="music-btn" type="button" title="Музика" onclick="toggleMusic(event)">🎵</button>
  <div id="ui"><div class="hint" id="hint">Натисни върху „МИМИ“ в центъра ✨</div></div>

  <div id="love-timer">
    <div class="timer-title">Заедно сме вече</div>
    <div class="timer-boxes">
      <div class="t-box"><span id="t-days">0</span><small>дни</small></div>
      <div class="t-box"><span id="t-hours">00</span><small>часа</small></div>
      <div class="t-box"><span id="t-mins">00</span><small>минути</small></div>
      <div class="t-box"><span id="t-secs">00</span><small>секунди</small></div>
    </div>
  </div>

  <canvas id="fx-canvas"></canvas>
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <script>
    var isPlaying = false;
    var hasMusicFile = true;
    var tunnelActive = false;
    var tunnelStartTime = 0;

    (function() {
      var audio = document.getElementById('bg-music');
      if (audio) {
        audio.addEventListener('error', function() {
          hasMusicFile = false;
          var mb = document.getElementById('music-btn');
          if (mb) mb.style.display = 'none';
        });
      }
      var startDate = new Date(2026, 8, 19, 11, 59, 0);
      function updateLoveTimer() {
        var now = new Date();
        var diff = Math.floor((now - startDate) / 1000);
        if (diff < 0) diff = 0;
        document.getElementById('t-days').textContent = Math.floor(diff / 86400);
        document.getElementById('t-hours').textContent = String(Math.floor((diff % 86400) / 3600)).padStart(2, '0');
        document.getElementById('t-mins').textContent = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
        document.getElementById('t-secs').textContent = String(diff % 60).padStart(2, '0');
      }
      updateLoveTimer();
      setInterval(updateLoveTimer, 1000);
    })();

    function startExperience() {
      var intro = document.getElementById('intro-screen');
      var audio = document.getElementById('bg-music');
      var musicBtn = document.getElementById('music-btn');
      if (intro) intro.classList.add('hidden');
      tunnelActive = true;
      tunnelStartTime = performance.now();
      if (hasMusicFile && audio && musicBtn) {
        musicBtn.style.display = 'flex';
        var p = audio.play();
        if (p !== undefined) {
          p.then(function() { isPlaying = true; musicBtn.classList.add('playing'); }).catch(function() {});
        }
      }
    }

    function toggleMusic(e) {
      if (e) e.stopPropagation();
      var audio = document.getElementById('bg-music');
      var musicBtn = document.getElementById('music-btn');
      if (!audio || !musicBtn) return;
      if (isPlaying) {
        audio.pause(); isPlaying = false;
        musicBtn.classList.remove('playing'); musicBtn.textContent = '🔇';
      } else {
        audio.play().then(function() {
          isPlaying = true; musicBtn.classList.add('playing'); musicBtn.textContent = '🎵';
        }).catch(function() {});
      }
    }

    (function() {
      const fxCanvas = document.getElementById('fx-canvas');
      const ctx = fxCanvas.getContext('2d');
      let w = fxCanvas.width = window.innerWidth;
      let h = fxCanvas.height = window.innerHeight;
      window.addEventListener('resize', () => { w = fxCanvas.width = window.innerWidth; h = fxCanvas.height = window.innerHeight; });

      const particles = [];
      const colors = ['#ff1e6e', '#ff66b2', '#ff99cc', '#ffffff', '#ff0055', '#e056fd'];

      function drawHeartShape(c, x, y, size, color, alpha, rotation) {
        c.save(); c.translate(x, y); c.rotate(rotation);
        c.globalAlpha = Math.max(0, alpha); c.fillStyle = color;
        c.shadowColor = color; c.shadowBlur = 10;
        c.beginPath(); const s = size * 0.5;
        c.moveTo(0, s * 0.35);
        c.bezierCurveTo(-s, -s * 0.6, -s * 1.6, s * 0.5, 0, s * 1.5);
        c.bezierCurveTo(s * 1.6, s * 0.5, s, -s * 0.6, 0, s * 0.35);
        c.fill(); c.restore();
      }

      window.triggerHeartFirework = function(cx, cy) {
        for (let i = 0; i < 65; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 2.2 + Math.random() * 7.5;
          particles.push({
            x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1.5,
            size: 8 + Math.random() * 11, color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 1, decay: 0.012 + Math.random() * 0.012, gravity: 0.09,
            rot: (Math.random() - 0.5) * 0.8, vRot: (Math.random() - 0.5) * 0.06
          });
        }
      };

      function spawnTrail(x, y) {
        for (let i = 0; i < 2; i++) {
          particles.push({
            x: x + (Math.random() - 0.5) * 12, y: y + (Math.random() - 0.5) * 12,
            vx: (Math.random() - 0.5) * 1.4, vy: -0.6 - Math.random() * 1.2,
            size: 6 + Math.random() * 7, color: colors[Math.floor(Math.random() * colors.length)],
            alpha: 0.95, decay: 0.025 + Math.random() * 0.015, gravity: -0.01,
            rot: (Math.random() - 0.5) * 0.5, vRot: (Math.random() - 0.5) * 0.04
          });
        }
      }

      window.addEventListener('pointermove', (e) => spawnTrail(e.clientX, e.clientY), { passive: true });
      window.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 0) spawnTrail(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

      function animateFX() {
        ctx.clearRect(0, 0, w, h);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.rot += p.vRot; p.alpha -= p.decay;
          if (p.alpha <= 0) { particles.splice(i, 1); continue; }
          drawHeartShape(ctx, p.x, p.y, p.size, p.color, p.alpha, p.rot);
        }
        requestAnimationFrame(animateFX);
      }
      animateFX();
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        "நான் உன்னை காதலிக்கிறேன்", "నేను నిన్ను ప్రేమిస్తున్నాను", "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ", "ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു",

        "Ez ji te hez dikim", "Би чамд хайртай", "Ma armastan sind", "Es tevi mīlu", "Aš tave myliu",
        "Të dua", "Те сакам", "Inħobbok", "Ég elska tig", "Tá grá agam duit",
        "Rwy'n dy garu di", "Tha gaol agam ort", "Ngiyakuthanda", "Ndiyakuthanda", "Ke a go rata",
        "Ndikukonda", "Ndinokuda", "Nakupenda", "Waan ku jeclahay", "Ina son ku",
        "Mo nifẹ rẹ", "A hụrụ m gị n'anya", "Mi amas vin", "Amo te", "Ti voglio bene",
        "T'estimo", "Maite zaitut", "Eu te quero", "Aloha wau iā ʻoe", "Aroha ahau ki a koe",
        "Ou te alofa ia te oe", "Ofa atu", "Kuv hlub koj", "Ndagukunda", "Обичам те завинаги"
      ];

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030108, 0.0045);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 16, 130);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.05;
      controls.minDistance = 8; controls.maxDistance = 110;
      controls.autoRotate = true; controls.autoRotateSpeed = 0.65;

      function createHeartPointTexture() {
        const c = document.createElement('canvas'); c.width = 64; c.height = 64;
        const g = c.getContext('2d'); g.clearRect(0, 0, 64, 64);
        g.shadowColor = '#ff1e7a'; g.shadowBlur = 10; g.fillStyle = '#ffffff';
        g.beginPath(); g.moveTo(32, 22);
        g.bezierCurveTo(32, 17, 24, 10, 16, 10);
        g.bezierCurveTo(6, 10, 6, 23, 6, 23);
        g.bezierCurveTo(6, 33, 18, 43, 32, 54);
        g.bezierCurveTo(46, 43, 58, 33, 58, 23);
        g.bezierCurveTo(58, 23, 58, 10, 48, 10);
        g.bezierCurveTo(40, 10, 32, 17, 32, 22);
        g.fill();
        return new THREE.CanvasTexture(c);
      }
      const heartTex = createHeartPointTexture();

      const tunnelGroup = new THREE.Group();
      scene.add(tunnelGroup);
      const tunnelRings = [];
      const ringCount = 26;

      for (let r = 0; r < ringCount; r++) {
        const ptsCount = 48;
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(ptsCount * 3);
        const col = new Float32Array(ptsCount * 3);
        const ringRadius = 6.5 + (r % 3) * 0.7;
        for (let i = 0; i < ptsCount; i++) {
          const t = (i / ptsCount) * Math.PI * 2;
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
          pos[i * 3] = (hx / 16) * ringRadius;
          pos[i * 3 + 1] = (hy / 16) * ringRadius;
          pos[i * 3 + 2] = 0;
          const c = new THREE.Color().setHSL(0.91 + (r % 5) * 0.015, 0.95, 0.65);
          col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const mat = new THREE.PointsMaterial({
          size: 0.95, map: heartTex, vertexColors: true, transparent: true,
          opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false
        });
        const ring = new THREE.Points(geo, mat);
        ring.position.set(0, 14, 48 + r * 3.4);
        ring.rotation.x = -0.22;
        tunnelGroup.add(ring);
        tunnelRings.push(ring);
      }

      const galaxyGroup = new THREE.Group();
      scene.add(galaxyGroup);

      const heartParticleCount = 3400;
      const heartGeo = new THREE.BufferGeometry();
      const heartPositions = new Float32Array(heartParticleCount * 3);
      const heartColors = new Float32Array(heartParticleCount * 3);
      const cInner = new THREE.Color(0xff1464);
      const cOuter = new THREE.Color(0xff99cc);

      for (let i = 0; i < heartParticleCount; i++) {
        const t = Math.random() * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        const r = Math.pow(Math.random(), 0.45);
        const zSpread = (1 - r * 0.7) * 5.5 * (Math.random() * 2 - 1);
        const scale = 0.25 * r;
        heartPositions[i * 3] = x * scale + (Math.random() - 0.5) * 0.3;
        heartPositions[i * 3 + 1] = (y * scale) + 1.2 + (Math.random() - 0.5) * 0.3;
        heartPositions[i * 3 + 2] = zSpread * r;
        const mixed = cInner.clone().lerp(cOuter, Math.random() * 0.8);
        heartColors[i * 3] = mixed.r; heartColors[i * 3 + 1] = mixed.g; heartColors[i * 3 + 2] = mixed.b;
      }
      heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
      heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));
      const heartMat = new THREE.PointsMaterial({
        size: 0.24, vertexColors: true, transparent: true, opacity: 0.9,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      const heartMesh = new THREE.Points(heartGeo, heartMat);
      galaxyGroup.add(heartMesh);

      const planetOrbitGroup = new THREE.Group();
      planetOrbitGroup.position.set(0, 1.0, 0);
      planetOrbitGroup.rotation.z = 0.28; planetOrbitGroup.rotation.x = 0.18;
      galaxyGroup.add(planetOrbitGroup);

      const planetHeartsCount = 420;
      const planetGeo = new THREE.BufferGeometry();
      const planetPos = new Float32Array(planetHeartsCount * 3);
      const planetCol = new Float32Array(planetHeartsCount * 3);
      const planetRadius = 1.15;
      for (let i = 0; i < planetHeartsCount; i++) {
        const phi = Math.acos(-1 + (2 * i) / planetHeartsCount);
        const theta = Math.sqrt(planetHeartsCount * Math.PI) * phi;
        planetPos[i * 3] = planetRadius * Math.cos(theta) * Math.sin(phi);
        planetPos[i * 3 + 1] = planetRadius * Math.sin(theta) * Math.sin(phi);
        planetPos[i * 3 + 2] = planetRadius * Math.cos(phi);
        const c = new THREE.Color().setHSL(0.92 + Math.random() * 0.06, 0.95, 0.72);
        planetCol[i * 3] = c.r; planetCol[i * 3 + 1] = c.g; planetCol[i * 3 + 2] = c.b;
      }
      planetGeo.setAttribute('position', new THREE.BufferAttribute(planetPos, 3));
      planetGeo.setAttribute('color', new THREE.BufferAttribute(planetCol, 3));
      const planetMat = new THREE.PointsMaterial({
        size: 0.32, map: heartTex, vertexColors: true, transparent: true,
        opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const heartPlanet = new THREE.Points(planetGeo, planetMat);
      heartPlanet.position.set(6.4, 0, 0);
      planetOrbitGroup.add(heartPlanet);

      const ringHeartsCount = 160;
      const ringGeo = new THREE.BufferGeometry();
      const ringPos = new Float32Array(ringHeartsCount * 3);
      const ringCol = new Float32Array(ringHeartsCount * 3);
      for (let i = 0; i < ringHeartsCount; i++) {
        const a = (i / ringHeartsCount) * Math.PI * 2;
        const rad = 5.4 + (Math.random() - 0.5) * 0.75;
        ringPos[i * 3] = Math.cos(a) * rad;
        ringPos[i * 3 + 1] = (Math.random() - 0.5) * 0.25;
        ringPos[i * 3 + 2] = Math.sin(a) * rad;
        const c = new THREE.Color().setHSL(0.93, 0.9, 0.75);
        ringCol[i * 3] = c.r; ringCol[i * 3 + 1] = c.g; ringCol[i * 3 + 2] = c.b;
      }
      ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPos, 3));
      ringGeo.setAttribute('color', new THREE.BufferAttribute(ringCol, 3));
      const ringMat = new THREE.PointsMaterial({
        size: 0.36, map: heartTex, vertexColors: true, transparent: true,
        opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false
      });
      const orbitRing = new THREE.Points(ringGeo, ringMat);
      planetOrbitGroup.add(orbitRing);

      function createCenterNameSprite(name) {
        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 256;
        const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, 512, 256);
        ctx.font = '800 88px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 24;
        ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(80, 0, 30, 0.85)';
        ctx.strokeText(name, 256, 128);
        ctx.fillStyle = '#ffffff'; ctx.fillText(name, 256, 128);
        const texture = new THREE.CanvasTexture(canvas); texture.minFilter = THREE.LinearFilter;
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 1, depthTest: false, depthWrite: false });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(5.4, 2.7, 1); sprite.position.set(0, 0.8, 0); sprite.renderOrder = 12;
        return sprite;
      }
      const nameSprite = createCenterNameSprite("МИМИ");
      galaxyGroup.add(nameSprite);

      function createPhotoSprite(url) {
        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const drawFrame = (img) => {
          ctx.clearRect(0, 0, 512, 512);
          const cx = 256, cy = 240, radius = 195;
          ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.shadowColor = '#ff1e7a'; ctx.shadowBlur = 35; ctx.fillStyle = '#240515'; ctx.fill(); ctx.restore();
          ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, radius - 6, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
          if (img) {
            const aspect = img.width / img.height;
            let dw = radius * 2, dh = radius * 2;
            if (aspect > 1) dw = dh * aspect; else dh = dw / aspect;
            ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
          } else {
            const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, radius);
            grad.addColorStop(0, '#ff4d94'); grad.addColorStop(1, '#4a0424');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 42px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('❤️ МИМИ ❤️', cx, cy + 12);
          }
          ctx.restore();
          ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, radius - 3, 0, Math.PI * 2);
          ctx.lineWidth = 8; ctx.strokeStyle = '#ff66b2'; ctx.shadowColor = '#ff0066'; ctx.shadowBlur = 20; ctx.stroke(); ctx.restore();
          ctx.save(); ctx.font = '800 44px "Segoe UI", Arial, sans-serif'; ctx.textAlign = 'center';
          ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 16; ctx.lineWidth = 5; ctx.strokeStyle = '#1a000d';
          ctx.strokeText('МИМИ ❤️', cx, 476); ctx.fillStyle = '#ffffff'; ctx.fillText('МИМИ ❤️', cx, 476); ctx.restore();
        };
        drawFrame(null);
        const texture = new THREE.CanvasTexture(canvas); texture.minFilter = THREE.LinearFilter;
        const img = new Image(); img.crossOrigin = "anonymous";
        img.onload = () => { drawFrame(img); texture.needsUpdate = true; };
        img.src = url;
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0, depthTest: false, depthWrite: false });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(0.01, 0.01, 1); sprite.position.set(0, 1.0, 0); sprite.renderOrder = 15;
        return sprite;
      }
      const photoSprite = createPhotoSprite(PHOTO_URL);
      galaxyGroup.add(photoSprite);

      let showPhotoMode = false;
      let transitionProgress = 0;
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downPos = { x: 0, y: 0 };

      renderer.domElement.addEventListener('pointerdown', (e) => { downPos = { x: e.clientX, y: e.clientY }; });
      renderer.domElement.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 10) return;
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hitTargets = showPhotoMode ? [photoSprite, nameSprite] : [nameSprite];
        const intersects = raycaster.intersectObjects(hitTargets);
        const centerWorld = new THREE.Vector3(0, 1.0, 0);
        galaxyGroup.localToWorld(centerWorld);
        if (intersects.length > 0 || raycaster.ray.distanceToPoint(centerWorld) < 3.4) {
          showPhotoMode = !showPhotoMode;
          hintEl.textContent = showPhotoMode ? "Натисни снимката, за да върнеш сърцето ❤️" : "Натисни върху „МИМИ“ в центъра ✨";
          hintEl.style.opacity = '1';
          if (window.triggerHeartFirework) {
            const proj = centerWorld.clone().project(camera);
            window.triggerHeartFirework((proj.x * 0.5 + 0.5) * window.innerWidth, (-proj.y * 0.5 + 0.5) * window.innerHeight);
          }
        }
      });

      function createTextSprite(text) {
        const canvas = document.createElement('canvas'); canvas.width = 512; canvas.height = 128;
        const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, 512, 128);
        ctx.font = '600 38px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.shadowColor = '#ff2a85'; ctx.shadowBlur = 16; ctx.fillStyle = '#ffffff';
        ctx.fillText(text, 256, 64);
        const texture = new THREE.CanvasTexture(canvas); texture.minFilter = THREE.LinearFilter;
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.92, depthWrite: false });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(7.2, 1.8, 1);
        return sprite;
      }

      const arms = 4;
      phrases.forEach((phrase, idx) => {
        const sprite = createTextSprite(phrase);
        const arm = idx % arms;
        const progress = idx / phrases.length;
        const radius = 9.0 + progress * 22;
        const angle = (arm * (Math.PI * 2 / arms)) + progress * Math.PI * 3.8;
        const yOffset = (Math.sin(idx * 1.7) * 3.5) * (0.4 + progress * 0.6);
        sprite.position.set(Math.cos(angle) * radius, yOffset, Math.sin(angle) * radius);
        galaxyGroup.add(sprite);
      });

      const dustCount = 3800;
      const dustGeo = new THREE.BufferGeometry();
      const dustPos = new Float32Array(dustCount * 3);
      const dustCol = new Float32Array(dustCount * 3);
      const colPink = new THREE.Color(0xff4da6);
      const colPurple = new THREE.Color(0x9d4edd);
      const colWhite = new THREE.Color(0xffffff);

      for (let i = 0; i < dustCount; i++) {
        const arm = i % arms;
        const r = 5 + Math.pow(Math.random(), 1.3) * 31;
        const spinAngle = r * 0.22;
        const branchAngle = (arm / arms) * Math.PI * 2;
        dustPos[i * 3] = Math.cos(branchAngle + spinAngle) * r + Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.5;
        dustPos[i * 3 + 1] = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.0;
        dustPos[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * r + Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.5;
        const pick = Math.random();
        const c = pick < 0.45 ? colPink : (pick < 0.8 ? colPurple : colWhite);
        dustCol[i * 3] = c.r; dustCol[i * 3 + 1] = c.g; dustCol[i * 3 + 2] = c.b;
      }
      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
      dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
      const dustMat = new THREE.PointsMaterial({
        size: 0.16, vertexColors: true, transparent: true, opacity: 0.78,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
      galaxyGroup.add(new THREE.Points(dustGeo, dustMat));

      const bgStarCount = 1400;
      const bgGeo = new THREE.BufferGeometry();
      const bgPos = new Float32Array(bgStarCount * 3);
      for (let i = 0; i < bgStarCount; i++) {
        bgPos[i * 3] = (Math.random() - 0.5) * 240;
        bgPos[i * 3 + 1] = (Math.random() - 0.5) * 240;
        bgPos[i * 3 + 2] = (Math.random() - 0.5) * 240;
      }
      bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
      scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({ size: 0.25, color: 0xffffff, transparent: true, opacity: 0.65 })));

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      let tunnelFinished = false;

      function animate() {
        requestAnimationFrame(animate);
        const elapsed = clock.getElapsedTime();

        if (tunnelActive && !tunnelFinished) {
          const dt = (performance.now() - tunnelStartTime) / 1000;
          const p = Math.min(1, dt / 2.4);
          const ease = 1 - Math.pow(1 - p, 3);
          camera.position.set(0, 32 - 16 * ease, 130 - 82 * ease);
          camera.lookAt(0, 0, 0);
          tunnelRings.forEach((ring, idx) => {
            ring.rotation.z = elapsed * (idx % 2 === 0 ? 0.6 : -0.6);
            ring.material.opacity = 0.95 * (1 - Math.pow(p, 2.2));
          });
          if (p >= 1) {
            tunnelFinished = true;
            tunnelGroup.visible = false;
            uiContainer.style.opacity = '1';
            timerContainer.style.opacity = '1';
            if (window.triggerHeartFirework) {
              window.triggerHeartFirework(window.innerWidth / 2, window.innerHeight / 2);
            }
          }
        }

        planetOrbitGroup.rotation.y = elapsed * 0.75;
        heartPlanet.rotation.y = -elapsed * 1.4;

        const target = showPhotoMode ? 1 : 0;
        transitionProgress += (target - transitionProgress) * 0.08;

        const beat = 1 + Math.sin(elapsed * 3.5) * 0.055;
        const heartScale = beat * (1 - transitionProgress * 0.75);
        heartMesh.scale.set(heartScale, heartScale, heartScale);
        heartMat.opacity = 0.9 * (1 - transitionProgress * 0.85);

        const nameScale = (1 - transitionProgress);
        nameSprite.scale.set(5.4 * nameScale, 2.7 * nameScale, 1);
        nameSprite.material.opacity = 1 - transitionProgress;

        const pScale = 7.4 * transitionProgress;
        photoSprite.scale.set(Math.max(0.01, pScale), Math.max(0.01, pScale), 1);
        photoSprite.material.opacity = transitionProgress;

        if (!tunnelActive || tunnelFinished) controls.update();
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
