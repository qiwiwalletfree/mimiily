<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Обичам те, МИМИ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030108;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #intro-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a0514 0%, #030108 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 1s ease, visibility 1s ease;
    }
    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .intro-sub {
      color: rgba(255, 200, 225, 0.75);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 24px;
      animation: fadeFloat 2.5s infinite ease-in-out;
    }
    #start-btn {
      position: relative;
      padding: 18px 42px;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #ff1e6e 0%, #ff5e9c 100%);
      border: 1px solid rgba(255, 180, 210, 0.6);
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 0 25px rgba(255, 30, 110, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.3);
      animation: pulseStart 1.8s infinite ease-in-out;
      transition: transform 0.2s ease;
    }
    #start-btn:active {
      transform: scale(0.94);
    }
    @keyframes pulseStart {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 30, 110, 0.6); }
      50% { transform: scale(1.07); box-shadow: 0 0 45px rgba(255, 45, 125, 0.95); }
    }
    @keyframes fadeFloat {
      0%, 100% { opacity: 0.6; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    #ui {
      position: fixed;
      top: 20px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .hint {
      color: rgba(255, 210, 230, 0.9);
      font-size: 12px;
      letter-spacing: 0.4px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 7px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 105, 180, 0.3);
      transition: opacity 0.6s ease;
    }
    #music-btn {
      position: fixed;
      top: 20px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 40, 110, 0.25);
      border: 1px solid rgba(255, 105, 180, 0.6);
      color: #fff;
      font-size: 18px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      backdrop-filter: blur(6px);
      box-shadow: 0 0 15px rgba(255, 40, 110, 0.4);
    }
    #music-btn.playing {
      animation: pulseBtn 1.5s infinite;
    }
    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 40, 110, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 22px rgba(255, 40, 110, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 40, 110, 0.4); }
    }
  </style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-sub">Имам изненада за теб</div>
    <button id="start-btn">Натисни ме ❤️</button>
  </div>

  <button id="music-btn" title="Музика">🎵</button>
  <div id="ui">
    <div class="hint" id="hint">Натисни върху „МИМИ“ в центъра ✨</div>
  </div>
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

  <script>
    // Зареждане на Three.js с резервни сървъри
    function loadScript(urls, callback) {
      let index = 0;
      function tryNext() {
        if (index >= urls.length) return;
        const s = document.createElement('script');
        s.src = urls[index++];
        s.onload = callback;
        s.onerror = tryNext;
        document.head.appendChild(s);
      }
      tryNext();
    }

    loadScript([
      "https://unpkg.com/three@0.128.0/build/three.min.js",
      "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
    ], function() {
      loadScript([
        "https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js",
        "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"
      ], initApp);
    });

    function initApp() {
      const PHOTO_URL = "photo.jpg";

      const phrases = [
        "Обичам те", "Обичам те, Мими", "Много те обичам", "Обичам те безкрайно", "Ти си моето всичко",
        "I love you", "Я тебя люблю", "Я тебе кохаю", "Я цябе кахаю", "Обичам те",
        "Te amo", "Je t'aime", "Ti amo", "Ich liebe dich", "Eu te amo",
        "Ik hou van jou", "Jag älskar dig", "Jeg elsker dig", "Jeg elsker deg", "Minä rakastan sinua",
        "Kocham Cię", "Miluji tě", "Ľúbim ťa", "Szeretlek", "Te iubesc",
        "Volim te", "Ljubim te", "Σ' αγαπώ", "Seni seviyorum", "أحبك",
        "אני אוהב אותך", "愛してる", "사랑해", "我爱你", "我愛你",
        "मैं तुमसे प्यार करता हूँ", "আমি তোমায় ভালোবাসি", "ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ", "मी तुझ्यावर प्रेम करतो",
        "நான் உன்னை காதலிக்கிறேன்", "నేను నిన్ను ప్రేమిస్తున్నాను", "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ", "ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു",
        "මම ඔයාට ආදරෙයි", "म तिमीलाई माया गर्छु", "Aku cinta kamu", "Saya cintakan awak", "Mahal kita",
        "Anh yêu em", "ฉันรักคุณ", "ខ្ញុំស្រឡាញ់អ្នក", "ຂ້ອຍຮັກເຈົ້າ", "ချစ်တယ်",
        "Мен сені сүйемін", "Мен сени сүйөм", "Men seni sevaman", "Men seni söýýärin", "Ман туро дӯст медорам",
        "Mən səni sevirəm", "მიყვარხარ", "Ես քեզ սիրում եմ", "دوستت دارم", "زه تا سره مینه لرم",
        "Ez ji te hez dikim", "Би чамд хайртай", "Ma armastan sind", "Es tevi mīlu", "Aš tave myliu",
        "Të dua", "Те сакам", "Inħobbok", "Ég elska tig", "Tá grá agam duit",
        "Rwy'n dy garu di", "Tha gaol agam ort", "Ngiyakuthanda", "Ndiyakuthanda", "Ke a go rata",
        "Ndikukonda", "Ndinokuda", "Nakupenda", "Waan ku jeclahay", "Ina son ku",
        "Mo nifẹ rẹ", "A hụrụ m gị n'anya", "Mi amas vin", "Amo te", "Ti voglio bene",
        "T'estimo", "Maite zaitut", "Eu te quero", "Aloha wau iā ʻoe", "Aroha ahau ki a koe",
        "Ou te alofa ia te oe", "Ofa atu", "Kuv hlub koj", "Ndagukunda", "Обичам те завинаги"
      ];

      const introScreen = document.getElementById('intro-screen');
      const startBtn = document.getElementById('start-btn');
      const uiContainer = document.getElementById('ui');
      const hintEl = document.getElementById('hint');
      const audio = document.getElementById('bg-music');
      const musicBtn = document.getElementById('music-btn');
      let isPlaying = false;
      let hasMusicFile = true;

      audio.addEventListener('error', () => {
        hasMusicFile = false;
        musicBtn.style.display = 'none';
      });

      startBtn.addEventListener('click', () => {
        introScreen.classList.add('hidden');
        uiContainer.style.opacity = '1';

        if (hasMusicFile) {
          musicBtn.style.display = 'flex';
          audio.play().then(() => {
            isPlaying = true;
            musicBtn.classList.add('playing');
          }).catch(() => {});
        }
      });

      musicBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          musicBtn.classList.remove('playing');
          musicBtn.textContent = '🔇';
        } else {
          audio.play().then(() => {
            isPlaying = true;
            musicBtn.classList.add('playing');
            musicBtn.textContent = '🎵';
          }).catch(() => {});
        }
      });

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030108, 0.0045);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 16, 48);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 8;
      controls.maxDistance = 110;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.65;

      const galaxyGroup = new THREE.Group();
      scene.add(galaxyGroup);

      // 1. 3D сърце в центъра
      const heartParticleCount = 3400;
      const heartGeo = new THREE.BufferGeometry();
      const heartPositions = new Float32Array(heartParticleCount * 3);
      const heartColors = new Float32Array(heartParticleCount * 3);

      const cInner = new THREE.Color(0xff1464);
      const cOuter = new THREE.Color(0xff99cc);

      for (let i = 0; i < heartParticleCount; i++) {
        const t = Math.random() * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        const r = Math.pow(Math.random(), 0.45);
        const zSpread = (1 - r * 0.7) * 5.5 * (Math.random() * 2 - 1);
        const scale = 0.25 * r;

        heartPositions[i * 3] = x * scale + (Math.random() - 0.5) * 0.3;
        heartPositions[i * 3 + 1] = (y * scale) + 1.2 + (Math.random() - 0.5) * 0.3;
        heartPositions[i * 3 + 2] = zSpread * r;

        const mixed = cInner.clone().lerp(cOuter, Math.random() * 0.8);
        heartColors[i * 3] = mixed.r;
        heartColors[i * 3 + 1] = mixed.g;
        heartColors[i * 3 + 2] = mixed.b;
      }

      heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
      heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

      const heartMat = new THREE.PointsMaterial({
        size: 0.22,
        vertexColors: true,
        transparent: true,
        opacity: 0.88,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const heartMesh = new THREE.Points(heartGeo, heartMat);
      galaxyGroup.add(heartMesh);

      // 1.5. Име МИМИ в центъра
      function createCenterNameSprite(name) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 256;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '800 88px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 24;
        ctx.lineWidth = 6;
        ctx.strokeStyle = 'rgba(80, 0, 30, 0.85)';
        ctx.strokeText(name, canvas.width / 2, canvas.height / 2);

        ctx.fillStyle = '#ffffff';
        ctx.fillText(name, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;

        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 1,
          depthTest: false,
          depthWrite: false
        });

        const sprite = new THREE.Sprite(material);
        sprite.scale.set(5.4, 2.7, 1);
        sprite.position.set(0, 0.8, 0);
        sprite.renderOrder = 12;
        return sprite;
      }

      const nameSprite = createCenterNameSprite("МИМИ");
      galaxyGroup.add(nameSprite);

      // 1.6. Снимка в неонова рамка
      function createPhotoSprite(url) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 512;

        const drawFrame = (img) => {
          ctx.clearRect(0, 0, 512, 512);
          const cx = 256, cy = 240, radius = 195;

          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, radius, 0, Math.PI * 2);
          ctx.shadowColor = '#ff1e7a';
          ctx.shadowBlur = 35;
          ctx.fillStyle = '#240515';
          ctx.fill();
          ctx.restore();

          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, radius - 6, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          if (img) {
            const aspect = img.width / img.height;
            let dw = radius * 2, dh = radius * 2;
            if (aspect > 1) {
              dw = dh * aspect;
            } else {
              dh = dw / aspect;
            }
            ctx.drawImage(img, cx - dw / 2, cy - dh / 2, dw, dh);
          } else {
            const grad = ctx.createRadialGradient(cx, cy, 20, cx, cy, radius);
            grad.addColorStop(0, '#ff4d94');
            grad.addColorStop(1, '#4a0424');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 42px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('❤️ МИМИ ❤️', cx, cy + 12);
          }
          ctx.restore();

          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, radius - 3, 0, Math.PI * 2);
          ctx.lineWidth = 8;
          ctx.strokeStyle = '#ff66b2';
          ctx.shadowColor = '#ff0066';
          ctx.shadowBlur = 20;
          ctx.stroke();
          ctx.restore();

          ctx.save();
          ctx.font = '800 44px "Segoe UI", Arial, sans-serif';
          ctx.textAlign = 'center';
          ctx.shadowColor = '#ff0055';
          ctx.shadowBlur = 16;
          ctx.lineWidth = 5;
          ctx.strokeStyle = '#1a000d';
          ctx.strokeText('МИМИ ❤️', cx, 476);
          ctx.fillStyle = '#ffffff';
          ctx.fillText('МИМИ ❤️', cx, 476);
          ctx.restore();
        };

        drawFrame(null);
        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;

        const img = new Image();
        img.onload = () => {
          drawFrame(img);
          texture.needsUpdate = true;
        };
        img.src = url;

        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 0,
          depthTest: false,
          depthWrite: false
        });

        const sprite = new THREE.Sprite(material);
        sprite.scale.set(0.01, 0.01, 1);
        sprite.position.set(0, 1.0, 0);
        sprite.renderOrder = 15;
        return sprite;
      }

      const photoSprite = createPhotoSprite(PHOTO_URL);
      galaxyGroup.add(photoSprite);

      let showPhotoMode = false;
      let transitionProgress = 0;

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downPos = { x: 0, y: 0 };

      renderer.domElement.addEventListener('pointerdown', (e) => {
        downPos = { x: e.clientX, y: e.clientY };
      });

      renderer.domElement.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
        if (dist > 10) return;

        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointer, camera);

        const hitTargets = showPhotoMode ? [photoSprite, nameSprite] : [nameSprite];
        const intersects = raycaster.intersectObjects(hitTargets);

        const centerWorld = new THREE.Vector3(0, 1.0, 0);
        galaxyGroup.localToWorld(centerWorld);
        const distToRay = raycaster.ray.distanceToPoint(centerWorld);

        if (intersects.length > 0 || distToRay < 3.4) {
          showPhotoMode = !showPhotoMode;
          hintEl.textContent = showPhotoMode 
            ? "Натисни снимката, за да върнеш сърцето ❤️" 
            : "Натисни върху „МИМИ“ в центъра ✨";
          hintEl.style.opacity = '1';
        }
      });

      // 2. Текстови спрайтове
      function createTextSprite(text) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 128;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = '600 38px "Segoe UI", Arial, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.shadowColor = '#ff2a85';
        ctx.shadowBlur = 16;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;

        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          opacity: 0.92,
          depthWrite: false
        });

        const sprite = new THREE.Sprite(material);
        sprite.scale.set(7.2, 1.8, 1);
        return sprite;
      }

      const arms = 4;
      phrases.forEach((phrase, idx) => {
        const sprite = createTextSprite(phrase);
        const arm = idx % arms;
        const progress = idx / phrases.length;
        const radius = 8.5 + progress * 22;
        const angle = (arm * (Math.PI * 2 / arms)) + progress * Math.PI * 3.8;
        const yOffset = (Math.sin(idx * 1.7) * 3.5) * (0.4 + progress * 0.6);

        sprite.position.set(
          Math.cos(angle) * radius,
          yOffset,
          Math.sin(angle) * radius
        );

        galaxyGroup.add(sprite);
      });

      // 3. Звезден прах
      const dustCount = 3800;
      const dustGeo = new THREE.BufferGeometry();
      const dustPos = new Float32Array(dustCount * 3);
      const dustCol = new Float32Array(dustCount * 3);

      const colPink = new THREE.Color(0xff4da6);
      const colPurple = new THREE.Color(0x9d4edd);
      const colWhite = new THREE.Color(0xffffff);

      for (let i = 0; i < dustCount; i++) {
        const arm = i % arms;
        const r = 5 + Math.pow(Math.random(), 1.3) * 31;
        const spinAngle = r * 0.22;
        const branchAngle = (arm / arms) * Math.PI * 2;

        const randomX = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.5;
        const randomY = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.0;
        const randomZ = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 2.5;

        dustPos[i * 3] = Math.cos(branchAngle + spinAngle) * r + randomX;
        dustPos[i * 3 + 1] = randomY;
        dustPos[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * r + randomZ;

        const pick = Math.random();
        const c = pick < 0.45 ? colPink : (pick < 0.8 ? colPurple : colWhite);
        dustCol[i * 3] = c.r;
        dustCol[i * 3 + 1] = c.g;
        dustCol[i * 3 + 2] = c.b;
      }

      dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
      dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));

      const dustMat = new THREE.PointsMaterial({
        size: 0.16,
        vertexColors: true,
        transparent: true,
        opacity: 0.72,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const galaxyDust = new THREE.Points(dustGeo, dustMat);
      galaxyGroup.add(galaxyDust);

      // 4. Кръгла планета от сърца около цялата галактика
      function creat
